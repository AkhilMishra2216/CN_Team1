# =====================================================================
# Ext C - service isolation. Load on Mac 3 AND Mac 4.
# Only the two edges may open the backend ports; everyone else gets an
# immediate TCP reset (block return) instead of a silent timeout.
#   10.7.31.128 = Mac 2 primary edge, 10.7.10.192 = Mac 3 standby edge
# Rules live in their own anchor, so /etc/pf.conf is never edited.
# =====================================================================
edges = "{ 10.7.31.128, 10.7.10.192 }"

pass in quick proto tcp from $edges to any port { 3001, 3002 }
block return in quick proto tcp from any to any port { 3001, 3002 }
