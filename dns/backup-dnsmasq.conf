# =====================================================================
# Team 1 BACKUP DNS - runs on Mac 3 (10.7.10.192)          Phase 2, Ext A
# Same records as the primary on Mac 1 (dns/team-dnsmasq.conf).
# Installed at: /opt/homebrew/etc/dnsmasq.conf on Mac 3
# Run (foreground, live query log):
#   sudo /opt/homebrew/sbin/dnsmasq -d -C /opt/homebrew/etc/dnsmasq.conf
# macOS firewall must allow dnsmasq, or LAN queries time out:
#   sudo /usr/libexec/ApplicationFirewall/socketfilterfw --unblockapp \
#        /opt/homebrew/Cellar/dnsmasq/2.93/sbin/dnsmasq
# =====================================================================

listen-address=127.0.0.1,10.7.10.192
bind-interfaces

no-resolv
server=1.1.1.1
server=8.8.8.8
local=/team1.test/

# Must match the primary, record for record
host-record=app.team1.test,10.7.31.128
host-record=api.team1.test,10.7.31.128
local-ttl=30

log-queries
