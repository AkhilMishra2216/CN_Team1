# =====================================================================
# Team 1 STANDBY edge - runs on Mac 3 (10.7.10.192)         Phase 2, Ext E
# Same pool and TLS settings as the primary edge (nginx/nginx.conf).
# Only differences: its own certificate files and X-Edge value.
# Installed at: /opt/homebrew/etc/nginx/servers/team1-standby.conf on Mac 3
# Test + start: sudo nginx -t && sudo nginx
# Becomes live only when DNS points app.team1.test at 10.7.10.192.
# =====================================================================

log_format lb '$remote_addr:$remote_port -> $upstream_addr [$time_local] '
              '"$request" $status X-Backend=$upstream_http_x_backend';

upstream team1_backends {
    server 10.7.10.192:3001 max_fails=1 fail_timeout=10s;   # Backend A - Mac 3 (this Mac)
    server 10.7.12.3:3002   max_fails=1 fail_timeout=10s;   # Backend B - Mac 4
}

server {
    listen 80;
    server_name app.team1.test api.team1.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    # Key generated on Mac 3; certificate signed by the Team 1 root CA on Mac 2
    # (see tls/standby-certificate.md). No private key is copied between Macs.
    ssl_certificate     /opt/homebrew/etc/nginx/certs/standby.app.team1.test.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/standby.app.team1.test.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /opt/homebrew/var/log/nginx/team1_standby_access.log lb;

    location / {
        proxy_pass http://team1_backends;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Edge "mac3-standby" always;
    }
}
