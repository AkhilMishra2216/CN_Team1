# =====================================================================
# Ext C - service isolation. Load on Mac 3 AND Mac 4 (rules as used in
# the Phase 2 run, see evidence/Phase-2/C-Isolation).
# Only the edge (Mac 2, 10.7.31.128) may open the backend ports; anyone
# else gets an immediate TCP reset (block return), not a silent timeout.
# Rules live in their own anchor, so /etc/pf.conf is never edited.
#
# Load:     sudo pfctl -a com.apple/cnproject -f phase2/config/pf-backend.conf
#           sudo pfctl -E
# Show:     sudo pfctl -a com.apple/cnproject -s rules
# Rollback: sudo pfctl -a com.apple/cnproject -F all && sudo pfctl -d
#
# Roll back before Ext E: the standby edge (Mac 4, 10.7.12.3) is not in this list,
# and Mac 3 would refuse its connections to Backend A.
# =====================================================================
pass in quick proto tcp from 10.7.31.128 to any port { 3001, 3002 }
block return in quick proto tcp from any to any port { 3001, 3002 }
