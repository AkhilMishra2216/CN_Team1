# =====================================================================
# Team 1 STANDBY edge - runs on Mac 4 (10.7.12.3)           Phase 2, Ext E
# Same backend pool and TLS settings as the primary edge on Mac 2
# (phase1/nginx/nginx.conf); only the X-Edge value differs.
# Serves the same mkcert certificate as Mac 2 (see phase2/standby-certificate.md).
# Install (CERT_DIR = folder holding team1.pem and team1-key.pem):
#   sed "s#CERT_DIR#$HOME/cn/certs#g" phase2/config/standby-edge.conf \
#     > /opt/homebrew/etc/nginx/servers/team1-standby.conf
#   sudo nginx -t && sudo nginx
# Becomes live only when DNS points app.team1.test at 10.7.12.3.
# =====================================================================

upstream team1_backends {
    server 10.7.10.192:3001 max_fails=1 fail_timeout=10s;   # Backend A - Mac 3
    server 10.7.12.3:3002   max_fails=1 fail_timeout=10s;   # Backend B - Mac 4 (this Mac)
}

server {
    listen 80;
    server_name app.team1.test api.team1.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    ssl_certificate     CERT_DIR/team1.pem;
    ssl_certificate_key CERT_DIR/team1-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://team1_backends;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        add_header X-Edge "mac4" always;
    }
}
